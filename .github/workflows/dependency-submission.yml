name: Automatic Dependency Submission

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    # Dependency submission is only meaningful for the upstream repo. In forks the dependency
    # graph is disabled, so every push would otherwise fail this job.
    if: github.repository == 'termux/termux-app'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
